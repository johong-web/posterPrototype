<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>AR 포스터 - 나라사랑카드 (Zappar)</title>

  <!-- A-Frame + Zappar -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="lib/zappar-aframe.js"></script>

  <link rel="stylesheet" href="css/style.css">

  <script>
    AFRAME.registerComponent("poster-tracker", {
      init: function () {
        this.el.setAttribute("visible", false);
        this.textureApplied = false;

        this.el.parentEl.addEventListener('zappar-visible', () => {
          this.el.setAttribute("visible", true);

          var videoEl = document.getElementById('poster-video');
          if (!videoEl) return;

          if (!this.textureApplied) {
            this.textureApplied = true;
            var plane = this.el.querySelector('a-plane');
            if (plane) {
              var mesh = plane.getObject3D('mesh');
              if (mesh) {
                var texture = new THREE.VideoTexture(videoEl);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                mesh.material = new THREE.ShaderMaterial({
                  uniforms: {
                    map: { value: texture },
                    radius: { value: 0.06 } // 둥근 정도 (0.0 ~ 0.5)
                  },
                  vertexShader: [
                    'varying vec2 vUv;',
                    'void main() {',
                    '  vUv = uv;',
                    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
                    '}'
                  ].join('\n'),
                  fragmentShader: [
                    'uniform sampler2D map;',
                    'uniform float radius;',
                    'varying vec2 vUv;',
                    'void main() {',
                    '  vec2 uv = vUv;',
                    '  vec2 p = abs(uv - 0.5) * 2.0;', // -1~1 범위로 변환
                    '  vec2 corner = max(p - (1.0 - radius * 2.0), 0.0);',
                    '  float d = length(corner) / (radius * 2.0);',
                    '  if (d > 1.0) discard;',
                    '  gl_FragColor = texture2D(map, uv);',
                    '}'
                  ].join('\n'),
                  side: THREE.DoubleSide,
                  transparent: true
                });
              }
            }
          }

          videoEl.play().catch(function(){});
        });

        this.el.parentEl.addEventListener('zappar-notvisible', () => {
          this.el.setAttribute("visible", false);
          var videoEl = document.getElementById('poster-video');
          if (videoEl) videoEl.pause();
        });
      }
    });
  </script>
</head>
<body>
  <!-- 비디오를 a-assets 밖에 배치 (A-Frame 자동재생 방지) -->
  <video
    id="poster-video"
    src="assets/video/jo-hong.mp4"
    preload="metadata"
    crossorigin="anonymous"
    playsinline
    webkit-playsinline
    muted
    loop
    style="display:none"
  ></video>

  <!-- 로딩 화면 -->
  <div id="loading">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>AR 로딩 중... (Zappar)</p>
      <p class="loading-hint">카메라 권한을 허용해주세요</p>
    </div>
  </div>

  <!-- 안내 UI -->
  <div id="scan-guide" class="hidden">
    <div class="guide-content">
      <p>포스터를 카메라에 비춰주세요</p>
    </div>
  </div>

  <!-- 사운드 활성화 버튼 (iOS용) -->
  <div id="unmute-overlay" class="hidden">
    <button id="unmute-btn">🔊 소리 켜기</button>
  </div>

  <!-- AR Scene -->
  <a-scene>
    <a-entity zappar-permissions-ui></a-entity>
    <a-entity zappar-compatibility-ui></a-entity>

    <a-camera zappar-camera></a-camera>

    <a-entity zappar-image="target: assets/marker/jo-hong.zpt">
      <a-entity poster-tracker>
        <a-plane
          material="shader: flat; side: double; color: black"
          width="1.262"
          height="2"
          position="0 0 0"
        ></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    window._audioUnlocked = false;

    document.addEventListener('DOMContentLoaded', () => {
      const loadingEl = document.getElementById('loading');
      const scanGuideEl = document.getElementById('scan-guide');
      const sceneEl = document.querySelector('a-scene');
      const unmuteOverlay = document.getElementById('unmute-overlay');
      const unmuteBtn = document.getElementById('unmute-btn');
      const video = document.getElementById('poster-video');

      function unlockAudio() {
        if (window._audioUnlocked) return;
        window._audioUnlocked = true;
        if (video) video.muted = false;
        unmuteOverlay.classList.add('hidden');
      }

      if (unmuteBtn) {
        unmuteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          unlockAudio();
        });
      }

      // 반복 재생 (loop 속성 + 안전 장치)
      if (video) {
        video.addEventListener('ended', () => {
          video.currentTime = 0;
          video.play().catch(function(){});
        });
      }

      // ===== 카메라 권한 디버그 =====
      const hintEl = loadingEl.querySelector('.loading-hint');
      function showDebug(msg) {
        if (hintEl) hintEl.textContent = msg;
        console.log('[debug]', msg);
      }

      // 환경 확인
      const isSecure = window.isSecureContext;
      const hasMD = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      const ua = navigator.userAgent;
      showDebug(`secure=${isSecure} mediaDevices=${hasMD}`);

      if (!isSecure) {
        showDebug('HTTPS가 아니라 카메라 사용 불가. URL에 https:// 확인하세요.');
      } else if (!hasMD) {
        showDebug('이 브라우저는 카메라 API 미지원. Chrome 최신 버전으로 열어주세요.');
      } else {
        // 사용자 터치 직후에 요청해야 일부 브라우저가 팝업을 띄움
        const triggerBtn = document.createElement('button');
        triggerBtn.textContent = '카메라 시작하기';
        triggerBtn.style.cssText = 'margin-top:20px;padding:12px 24px;font-size:16px;background:#4caf50;color:#fff;border:none;border-radius:8px;';
        loadingEl.querySelector('.loading-content').appendChild(triggerBtn);

        triggerBtn.addEventListener('click', async () => {
          triggerBtn.disabled = true;
          showDebug('카메라 권한 요청 중...');
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment' },
              audio: false,
            });
            stream.getTracks().forEach((t) => t.stop());
            showDebug('카메라 권한 OK. AR 초기화 중...');
            triggerBtn.remove();
          } catch (e) {
            showDebug('카메라 실패: ' + (e.name || '') + ' / ' + (e.message || '') + ' / UA=' + ua);
            triggerBtn.disabled = false;
            triggerBtn.textContent = '다시 시도';
          }
        });
      }

      sceneEl.addEventListener('loaded', () => {
        loadingEl.classList.add('hidden');
        scanGuideEl.classList.remove('hidden');
      });

      const targetEl = document.querySelector('[zappar-image]');
      targetEl.addEventListener('zappar-visible', () => {
        scanGuideEl.classList.add('hidden');
        if (!window._audioUnlocked) unmuteOverlay.classList.remove('hidden');
      });

      targetEl.addEventListener('zappar-notvisible', () => {
        scanGuideEl.classList.remove('hidden');
      });

      document.body.addEventListener('click', () => {
        unlockAudio();
      }, { once: true });
    });
  </script>
</body>
</html>
